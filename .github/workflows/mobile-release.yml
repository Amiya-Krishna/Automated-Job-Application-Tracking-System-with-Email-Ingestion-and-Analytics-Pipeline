name: Mobile release (EAS)

# staging:
# Every push to main that touches mobile/ publishes an OTA update
# to the staging channel.
#
# production:
# Manual from the Actions tab, protected by the "production" environment.
# Configure required reviewers in:
# GitHub -> Settings -> Environments
#
# Production actions:
# update | build | submit | rollback
#
# Required repository secret:
# EXPO_TOKEN
#
# Required EAS environment variable:
# EXPO_PUBLIC_API_URL (HTTPS)
# Configure it for both staging and production using:
# eas env:create

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

  workflow_dispatch:
    inputs:
      action:
        description: 'What to do on PRODUCTION'
        type: choice
        options:
          - update
          - build
          - submit
          - rollback
        default: update
        required: true

      rollback_group:
        description: 'Rollback only: previous update GROUP ID to republish'
        required: false

      platform:
        description: 'Build/submit platform'
        type: choice
        options:
          - all
          - android
          - ios
        default: all
        required: true

permissions:
  contents: read

jobs:
  # ============================================================
  # STAGING OTA UPDATE
  # ============================================================
  staging-update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish staging OTA update
        run: >
          eas update
          --channel staging
          --environment preview
          --message "staging ${{ github.sha }}"
          --non-interactive

  # ============================================================
  # PRODUCTION
  # ============================================================
  production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ==========================================================
      # OTA UPDATE
      # ==========================================================
      - name: OTA update
        if: inputs.action == 'update'
        run: >
          eas update
          --channel production
          --environment production
          --message "production ${{ github.sha }}"
          --non-interactive

      # ==========================================================
      # BUILD
      # ==========================================================
      - name: Store build
        if: inputs.action == 'build'
        run: >
          eas build
          --profile production
          --platform ${{ inputs.platform }}
          --non-interactive
          --no-wait

      # ==========================================================
      # SUBMIT
      # ==========================================================
      - name: Submit latest build to stores
        if: inputs.action == 'submit'
        run: >
          eas submit
          --profile production
          --platform ${{ inputs.platform }}
          --latest
          --non-interactive

      # ==========================================================
      # ROLLBACK OTA
      # ==========================================================
      - name: Roll back OTA
        if: inputs.action == 'rollback'
        run: |
          test -n "${{ inputs.rollback_group }}" || {
            echo "rollback_group is required"
            exit 1
          }

          eas update:republish \
            --group "${{ inputs.rollback_group }}" \
            --destination-channel production \
            --message "rollback to ${{ inputs.rollback_group }}" \
            --non-interactive