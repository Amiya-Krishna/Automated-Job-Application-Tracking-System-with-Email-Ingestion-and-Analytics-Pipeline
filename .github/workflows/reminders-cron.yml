name: Reminder scheduler

# Only needed when the API host sleeps when idle (for example,
# Render free tier), so the in-process scheduler cannot run.
#
# Set REMINDERS_ENABLED=false on the server and add these
# repository secrets:
#
# API_URL
#   Example: https://job-application-tracker-portal-o1ls.onrender.com
#
# CRON_SECRET
#   Same value as the server's CRON_SECRET.
#
# The workflow automatically skips when the secrets are not configured.

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

permissions: {}

jobs:
  run:
    name: Trigger reminder pass
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Trigger reminder pass
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL/CRON_SECRET not configured; skipping."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 120 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            "$API_URL/api/notifications/run-reminders"