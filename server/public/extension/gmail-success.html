<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>TrackTrail — Gmail</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #1e293b;
        padding: 40px;
        border-radius: 20px;
        max-width: 380px;
        text-align: center;
      }
      h1 { font-size: 20px; margin-bottom: 8px; }
      p { color: #cbd5e1; font-size: 14px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Finishing up…</h1>
      <p id="msg">One moment.</p>
    </div>
    <script>
      // The TrackTrail extension watches for this page, closes this tab and
      // brings you back to the page where you clicked Connect. This page only
      // reports the result (the extension re-checks the real status itself),
      // and covers the case where the extension isn't able to do that.
      (function () {
        var status = new URLSearchParams(location.search).get("gmail");
        var text = {
          connected: ["Gmail connected ✅", "You can close this tab and go back to TrackTrail. Your Email status will show Connected."],
          no_refresh_token: ["Almost there", "Google didn't return a fresh permission grant. Remove TrackTrail's access at myaccount.google.com/permissions, then try Connect again."],
          error: ["Couldn't connect Gmail", "Something went wrong. Close this tab and try Connect again."],
        }[status] || ["Gmail", "You can close this tab and go back to TrackTrail."];
        document.getElementById("title").textContent = text[0];
        document.getElementById("msg").textContent = text[1];
        // Drop the result from the address bar/history; leave nothing sensitive here anyway.
        try { history.replaceState(null, "", location.pathname); } catch (e) {}
      })();
    </script>
  </body>
</html>
